    metaUniv:       "Technical University of Cluj-Napoca",

    btnCollect:     "Collect",

    btnExportPdf:   "Export PDF",
    btnGraph:       "Graph",

    tabWeek:        "Weekly",
    tabMonth:       "Monthly",
    tabAll:         "All",
    btnToday:       "Today",
    thSource:       "Source",
    thArticles:     "Articles",
    importLabel:    "Import article by URL",
    importSourcePh: "Source (optional)",
    importBtn:      "Import",
    loading:        "Loading…",
    loadingBody:    "Please wait.",
    allArticles:    "All articles",
    emptyTitle:     "No articles for this period",
    emptyBody:      "Automatic collection runs every 30 minutes.<br>Press <strong>Collect</strong> for an immediate update.",
    errTitle:       "Error",
    errNet:         "Network error",
    errSearch:      "Search error.",
    importMissing:  "Please enter a URL.",
    importingMsg:   "Importing...",
    importDupe:     "Article already exists in database.",
    searching:      "Searching…",
    searchDoneFn:   (s, i, d) => `Search complete:\n• ${s} Google results\n• ${i} new articles imported\n• ${d} duplicates ignored`,
    importedFn:     (t, k) => `Imported: "${t}" · keywords: ${k}`,
    importErrFn:    (e) => `Error: ${e}`,
    countFn:        (n, s) => `${n} article${n!==1?"s":""} from ${s} source${s!==1?"s":""}`,
    summaryFn:      (n, s, t) => `${n} relevant article${n!==1?"s":""} from ${s} source${s!==1?"s":""} — updated at ${t}`,

let _lang = localStorage.getItem("pressreview_lang") || "ro";
const T = () => TRANSLATIONS[_lang];

function applyLang() {
  document.documentElement.lang = _lang;
  document.querySelectorAll(".lang-btn").forEach(b =>
    b.classList.toggle("active", b.dataset.lang === _lang)
  );
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const v = T()[el.dataset.i18n];
    if (v !== undefined) el.textContent = v;
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
    const v = T()[el.dataset.i18nPlaceholder];
    if (v !== undefined) el.placeholder = v;
  });
  // Re-render dynamic content
  updateHeroDisplay();
  if (_lastDigestData) renderDigest(_lastDigestData);
}

/* ── Date helpers ────────────────────────────────────────── */
function todayISO() { return new Date().toISOString().slice(0, 10); }

function isoFromParts(y, m, d) {
  return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}

function prevISO(iso, period) {
  const [y, m, d] = iso.split("-").map(Number);
  if (period === "day")   return isoFromParts(...datePlusDays(y,m,d,-1));
  if (period === "week")  return isoFromParts(...datePlusDays(y,m,d,-7));
  if (period === "month") { const dt = new Date(y, m-2, 1); return isoFromParts(dt.getFullYear(), dt.getMonth()+1, 1); }
}

function nextISO(iso, period) {
  const [y, m, d] = iso.split("-").map(Number);
  if (period === "day")   return isoFromParts(...datePlusDays(y,m,d,+1));
  if (period === "week")  return isoFromParts(...datePlusDays(y,m,d,+7));
  if (period === "month") { const dt = new Date(y, m, 1); return isoFromParts(dt.getFullYear(), dt.getMonth()+1, 1); }
}

function datePlusDays(y, m, d, delta) {
  const dt = new Date(y, m-1, d+delta);
  return [dt.getFullYear(), dt.getMonth()+1, dt.getDate()];
}

function formatDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  return {
    day:  T().days[dt.getDay()],
    date: `${d} ${T().months[m - 1]}`,
    year: String(y),
    full: `${T().days[dt.getDay()]}, ${d} ${T().months[m - 1]} ${y}`,
  };
}

function formatRange(startISO, endISO, period) {
  const [sy, sm, sd] = startISO.split("-").map(Number);
  const [ey, em, ed] = endISO.split("-").map(Number);
  if (period === "month") return { label: `${T().months[sm - 1]} ${sy}`, year: String(sy) };
  const sameMonth = sm === em, sameYear = sy === ey;
  const startStr = sameMonth ? String(sd) : `${sd} ${T().months[sm - 1]}`;
  const endStr   = `${ed} ${T().months[em - 1]}`;
  const yearStr  = sameYear ? String(sy) : `${sy} – ${ey}`;
  return { label: `${startStr} – ${endStr}`, year: yearStr };
}

function esc(s) {
  return String(s ?? "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function sourceInitials(name) {
  return name.split(/[\s\/\-]+/).map(w => w[0] || "").join("").toUpperCase().slice(0, 2);
}

function sourceColor(name) {
  const colors = ["#1D1D1F","#1a4fb5","#1a7a36","#6b1ab5","#b54a1a","#0071E3","#1a6b6b","#5a1ab5"];
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xFFFFFF;
  return colors[Math.abs(h) % colors.length];
}

/* ── Navigation state ────────────────────────────────────── */
function updateNavLabel() {
  const isAll = _currentPeriod === "all";
  document.getElementById("btn-prev").style.visibility  = isAll ? "hidden" : "";
  document.getElementById("btn-next").style.visibility  = isAll ? "hidden" : "";
  document.getElementById("btn-today").style.visibility = isAll ? "hidden" : "";
  if (!isAll) {
    document.getElementById("btn-next").disabled = nextISO(_currentISO, _currentPeriod) > todayISO();
  }
}

function updateHeroDisplay() {
  if (!_currentISO) return;
  if (_currentPeriod === "day") {
    const d = formatDate(_currentISO);
    document.getElementById("hero-date").innerHTML = `${d.day}, ${d.date} <span>${d.year}</span>`;
  } else if (_currentPeriod === "all") {
    document.getElementById("hero-date").innerHTML = T().allArticles;
  } else if (_lastDigestData) {
    const { label, year } = formatRange(_lastDigestData.date_start, _lastDigestData.date_end, _currentPeriod);
    document.getElementById("hero-date").innerHTML = `${label} <span>${year}</span>`;
  }
}

/* ── Render ──────────────────────────────────────────────── */
let _lastDigestData = null;

function renderDigest(data) {
  _lastDigestData = data;
  const list    = document.getElementById("digest-list");
  const strip   = document.getElementById("summary-strip");
  const countEl = document.getElementById("hero-count");

  if (!data.entries || data.entries.length === 0) {
    list.innerHTML = `
      <div class="state-card">
        <div class="state-icon">🔍</div>
        <p class="state-title">${T().emptyTitle}</p>
        <p class="state-body">${T().emptyBody}</p>
      </div>`;
    strip.style.display = "none";
    countEl.textContent = "";
    return;
  }

  const total   = data.total_articles;
  const sources = data.entries.length;
  countEl.textContent = T().countFn(total, sources);

  const genTime = data.generated_at
    ? new Date(data.generated_at).toLocaleTimeString(T().locale, { hour:"2-digit", minute:"2-digit" })
    : "";
  document.getElementById("summary-text").textContent = T().summaryFn(total, sources, genTime);
  strip.style.display = "flex";

  list.innerHTML = data.entries.map((entry, idx) => {
    const color    = sourceColor(entry.source);
    const initials = sourceInitials(entry.source);
    const count    = entry.articles.length;

    const showDate = data.period !== "day";
    const articleItems = entry.articles.map(art => {
      const dateEl = showDate && art.published_date
        ? `<p class="article-date">${formatDate(art.published_date.slice(0,10)).full}</p>`
        : "";
      const titleEl = art.url
        ? `<a class="article-link" href="${esc(art.url)}" target="_blank" rel="noopener">${esc(art.title)}</a>`
        : `<span class="article-link no-link">${esc(art.title)}</span>`;
      const snippet = art.snippet
        ? `<p class="article-snippet">${esc(art.snippet.slice(0, 180))}${art.snippet.length > 180 ? "…" : ""}</p>`
        : "";
      const kwTags = (art.matched_keywords || []).map(k => `<span class="tag tag-kw">${esc(k)}</span>`).join("");
      const pTags  = (art.matched_persons  || []).map(p => `<span class="tag tag-person">${esc(p)}</span>`).join("");
      const tags   = (kwTags || pTags) ? `<div class="tags">${kwTags}${pTags}</div>` : "";
      return `<div class="article-item">${dateEl}${titleEl}${snippet}${tags}</div>`;
    }).join("");

    return `
      <div class="entry-card">
        <div class="cell-nr">${idx + 1}</div>
        <div class="cell-source">
          <div class="source-icon" style="background:${color}">${esc(initials)}</div>
          <div>
            <div class="source-name">${esc(entry.source)}</div>
            <div class="source-count">${T().artCountFn(count)}</div>
          </div>
        </div>
        <div class="cell-content">${articleItems}</div>
      </div>`;
  }).join("");
}

/* ── Fetch ───────────────────────────────────────────────── */
let _currentPeriod = "day";
let _currentISO    = todayISO();

async function loadDigest(iso, period) {
  _currentISO    = iso;
  _currentPeriod = period;
  updateNavLabel();

  const list = document.getElementById("digest-list");
  list.innerHTML = `<div class="state-card"><div class="state-icon pulse">📰</div><p class="state-title">${T().loading}</p></div>`;
  document.getElementById("summary-strip").style.display = "none";
  document.getElementById("hero-count").textContent = "";

  updateHeroDisplay();
  if (period !== "day" && period !== "all") {
    document.getElementById("hero-date").innerHTML = `<span style="color:var(--text-3)">${T().loading}</span>`;
  }

  try {
    const r = await fetch(`/api/digest?date=${iso}&period=${period}`);
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      list.innerHTML = `<div class="state-card"><p class="state-title">${T().errTitle}</p><p class="state-body">${esc(e.detail || `HTTP ${r.status}`)}</p></div>`;
      return;
    }
    const data = await r.json();
    if (period !== "day" && period !== "all") {
      const { label, year } = formatRange(data.date_start, data.date_end, period);
      document.getElementById("hero-date").innerHTML = `${label} <span>${year}</span>`;
    }
    renderDigest(data);
  } catch (err) {
    list.innerHTML = `<div class="state-card"><p class="state-title">${T().errNet}</p><p class="state-body">${esc(String(err))}</p></div>`;
  }
}

/* ── Collect ─────────────────────────────────────────────── */
async function triggerCollect() {
  const btn  = document.getElementById("btn-collect");
  const icon = document.getElementById("collect-icon");
  btn.disabled = true;
  icon.parentElement.classList.add("btn-collect-spin");
  try {
    const r = await fetch("/api/collect", { method: "POST" });
    await r.json().catch(() => {});
    btn.disabled = false;
    icon.parentElement.classList.remove("btn-collect-spin");
    if (r.ok) setTimeout(() => loadDigest(_currentISO, _currentPeriod), 600);
  } catch {
    btn.disabled = false;
    icon.parentElement.classList.remove("btn-collect-spin");
  }
}

/* ── Init ────────────────────────────────────────────────── */
(function () {
  // Language toggle
  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      _lang = btn.dataset.lang;
      localStorage.setItem("pressreview_lang", _lang);
      applyLang();
    });
  });

  // Period tabs
  document.querySelectorAll(".period-tab").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".period-tab").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      loadDigest(_currentISO, btn.dataset.period);
    });
  });

  document.getElementById("btn-prev").addEventListener("click", () => {
    loadDigest(prevISO(_currentISO, _currentPeriod), _currentPeriod);
  });

  document.getElementById("btn-next").addEventListener("click", () => {
    const next = nextISO(_currentISO, _currentPeriod);
    if (next <= todayISO()) loadDigest(next, _currentPeriod);
  });

  document.getElementById("btn-today").addEventListener("click", () => {
    loadDigest(todayISO(), _currentPeriod);
  });

  document.getElementById("btn-collect").addEventListener("click", triggerCollect);

  document.getElementById("btn-search").addEventListener("click", async () => {
    const btn     = document.getElementById("btn-search");
    const btnSpan = btn.querySelector("[data-i18n]");
    btn.disabled  = true;
    btnSpan.textContent = T().searching;
    try {
      const r = await fetch("/api/search", { method: "POST" });
      const d = await r.json();
      if (!r.ok) {
        alert(d.detail || T().errSearch);
      } else {
        alert(T().searchDoneFn(d.searched, d.imported, d.duplicate));
        setTimeout(() => loadDigest(_currentISO, _currentPeriod), 600);
      }
    } catch (err) {
      alert(T().importErrFn(err));
    } finally {
      btn.disabled = false;
      btnSpan.textContent = T().btnSearch;
    }
  });

  // Import URL panel
  document.getElementById("btn-show-import").addEventListener("click", () => {
    const panel = document.getElementById("import-panel");
    panel.style.display = panel.style.display === "none" ? "block" : "none";
  });

  document.getElementById("btn-import-go").addEventListener("click", async () => {
    const url    = document.getElementById("import-url").value.trim();
    const source = document.getElementById("import-source").value.trim();
    const status = document.getElementById("import-status");
    if (!url) { status.textContent = T().importMissing; return; }
    status.textContent = T().importingMsg;
    document.getElementById("btn-import-go").disabled = true;
    try {
      const r = await fetch("/api/import", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url, source_name: source }),
      });
      const d = await r.json();
      if (!r.ok) {
        status.style.color = "var(--accent)";
        status.textContent = T().importErrFn(d.detail || r.status);
      } else if (d.status === "duplicate") {
        status.style.color = "var(--text-2)";
        status.textContent = T().importDupe;
      } else {
        status.style.color = "var(--green)";
        const kws = (d.matched_keywords || []).join(", ") || "—";
        status.textContent = T().importedFn((d.title||"").slice(0,60), kws);
        document.getElementById("import-url").value = "";
        const iso = d.published_date ? d.published_date.slice(0,10) : _currentISO;
        setTimeout(() => loadDigest(iso, _currentPeriod), 800);
      }
    } catch (err) {
      status.style.color = "var(--accent)";
      status.textContent = String(err);
    } finally {
      document.getElementById("btn-import-go").disabled = false;
    }
  });

  document.getElementById("btn-export-pdf").addEventListener("click", () => {
    const url = `/api/report?date=${_currentISO}&period=${_currentPeriod}`;
    const a   = document.createElement("a");
    a.href     = url;
    a.download = `press-review-${_currentISO}-${_currentPeriod}.pdf`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });

  // Apply saved language and load
  applyLang();
  loadDigest(todayISO(), "day");
})();
</script>
</body>
</html>
